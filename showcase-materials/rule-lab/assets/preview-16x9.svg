<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Rule Lab — a fix must keep its counterexample</title>
  <desc id="desc">A rule comparison keeps a positive clickable-div match and a negative semantic-button no-match while a fresh receipt stays bound to the target.</desc>
  <defs>
    <radialGradient id="glowA" cx="14%" cy="8%" r="52%"><stop offset="0" stop-color="#7ee7e2" stop-opacity=".17"/><stop offset="1" stop-color="#0f1020" stop-opacity="0"/></radialGradient>
    <radialGradient id="glowB" cx="90%" cy="88%" r="50%"><stop offset="0" stop-color="#c9a7ff" stop-opacity=".18"/><stop offset="1" stop-color="#0f1020" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2e2754"/><stop offset="1" stop-color="#1b1b33"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0f1020"/>
  <rect width="1600" height="900" fill="url(#glowA)"/><rect width="1600" height="900" fill="url(#glowB)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#f7f5ff">
    <text x="112" y="148" font-size="22" font-weight="700" letter-spacing="3" fill="#7ee7e2">RULE LAB / W2 VERIFICATION</text>
    <text x="112" y="290" font-size="76" font-weight="700">A fix must keep</text>
    <text x="112" y="382" font-size="76" font-weight="700">its counterexample.</text>
    <text x="112" y="458" font-size="26" fill="#b8b5cf">Start from a finding, change one isolated rule,</text>
    <text x="112" y="498" font-size="26" fill="#b8b5cf">and compare both sides before saving the reason.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#e2dcff" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="15" fill="#b8b5cf" letter-spacing="2">NO-CLICKABLE-DIV · WARNING</text>
      <text x="504" y="58" font-size="16" fill="#f4c76d" font-weight="700">RECEIPT FRESH</text>
      <rect x="42" y="96" width="560" height="160" fill="#0f1020" fill-opacity=".68" stroke="#e2dcff" stroke-opacity=".25"/>
      <text x="66" y="136" font-size="18" fill="#c9a7ff" font-weight="700">FINDING → ISOLATED DRAFT</text>
      <text x="66" y="178" font-size="17" fill="#f7f5ff">keyboard risk · semantic interaction</text>
      <text x="66" y="214" font-size="16" fill="#b8b5cf">same Quality Runner engine · target-bound</text>
      <rect x="42" y="286" width="560" height="190" fill="#0f1020" fill-opacity=".68" stroke="#e2dcff" stroke-opacity=".25"/>
      <line x1="322" y1="286" x2="322" y2="476" stroke="#e2dcff" stroke-opacity=".25"/>
      <text x="66" y="326" font-size="17" fill="#c9a7ff" font-weight="700">POSITIVE FIXTURE</text>
      <text x="66" y="364" font-size="16" fill="#b8b5cf">clickable div</text><text x="66" y="400" font-size="22" fill="#7ee7e2" font-weight="700">MATCH · preserved ✓</text>
      <text x="346" y="326" font-size="17" fill="#c9a7ff" font-weight="700">NEGATIVE FIXTURE</text>
      <text x="346" y="364" font-size="16" fill="#b8b5cf">semantic button</text><text x="346" y="400" font-size="22" fill="#7ee7e2" font-weight="700">NO MATCH · preserved ✓</text>
      <text x="42" y="532" font-size="17" fill="#b8b5cf">Gained matches: none · Lost matches: none</text>
      <text x="42" y="566" font-size="17" fill="#b8b5cf">Local proof · IDE parity and hosted handoff remain open.</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#8885a5">RULE LAB / CANDIDATE LOCAL MATERIAL</text>
</svg>
