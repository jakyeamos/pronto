<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Review Sandbox current local evidence</title>
  <desc id="desc">A disposable review scenario runs in a detached worktree, removes clean state, and retains dirty state.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11181e"/><stop offset="1" stop-color="#202b32"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29444a"/><stop offset="1" stop-color="#1d2a31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#11181e"/>
  <circle cx="1450" cy="80" r="380" fill="#9be9c1" opacity=".08"/>
  <g font-family="Arial, sans-serif" fill="#f4f6f1">
    <text x="112" y="126" fill="#9be9c1" font-size="19" font-weight="700" letter-spacing="3">REVIEW SANDBOX · LOCAL</text>
    <text x="112" y="240" font-size="68" font-weight="700">Cleanup</text>
    <text x="112" y="322" font-size="68" font-weight="700">follows proof.</text>
    <text x="112" y="405" fill="#a9bab6" font-size="27">Preview one declared scenario without touching</text>
    <text x="112" y="444" fill="#a9bab6" font-size="27">the primary checkout. Retain what needs recovery.</text>
    <g filter="url(#shadow)">
      <rect x="875" y="118" width="590" height="630" rx="18" fill="#1d2a31" stroke="#9be9c1" stroke-opacity=".24"/>
    </g>
    <text x="920" y="175" fill="#a9bab6" font-size="18" letter-spacing="3">DETACHED SCENARIO</text>
    <text x="920" y="216" font-size="34" font-weight="700">fixture revision 8040f3a</text>
    <rect x="920" y="254" width="500" height="82" rx="8" fill="#11181e" stroke="#9be9c1" stroke-opacity=".25"/>
    <text x="950" y="286" fill="#9be9c1" font-size="18" font-weight="700" letter-spacing="2">PREVIEW</text>
    <text x="950" y="316" fill="#a9bab6" font-size="20">setup → run → clean proof</text>
    <rect x="920" y="360" width="240" height="142" rx="8" fill="#11181e" stroke="#9be9c1" stroke-opacity=".25"/>
    <text x="950" y="400" fill="#9be9c1" font-size="19" font-weight="700" letter-spacing="2">CLEAN</text>
    <text x="950" y="435" fill="#a9bab6" font-size="20">scenario passed</text>
    <text x="950" y="468" fill="#9be9c1" font-size="19" font-weight="700">REMOVED</text>
    <rect x="1180" y="360" width="240" height="142" rx="8" fill="#11181e" stroke="#ffc878" stroke-opacity=".45"/>
    <text x="1210" y="400" fill="#ffc878" font-size="19" font-weight="700" letter-spacing="2">DIRTY</text>
    <text x="1210" y="435" fill="#a9bab6" font-size="20">artifact preserved</text>
    <text x="1210" y="468" fill="#ffc878" font-size="19" font-weight="700">RETAINED</text>
    <rect x="920" y="526" width="500" height="98" rx="8" fill="#11181e" stroke="#ff958b" stroke-opacity=".5"/>
    <text x="950" y="566" fill="#ff958b" font-size="19" font-weight="700" letter-spacing="2">CANCELLATION LIMIT</text>
    <text x="950" y="600" fill="#a9bab6" font-size="20">exit 130 is recorded as failed today</text>
    <text x="920" y="686" fill="#9be9c1" font-size="20" font-weight="700">PRIMARY CHECKOUT UNCHANGED</text>
    <text x="112" y="780" fill="#a9bab6" font-size="19">Local evidence only · process ownership, hosting, and publication remain gated.</text>
  </g>
</svg>
