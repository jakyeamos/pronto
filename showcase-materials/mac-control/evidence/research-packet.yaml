key_facts:
  - id: fact-001
    text: "Mac Control is a command-first macOS control plane whose per-user daemon owns the GUI session and exposes a local, owner-only Unix socket to its CLI."
    source_ids: [source-repo-readme, source-installed-capabilities]
    temporal_scope: { state: as_of, as_of: "2026-08-12" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:10:45Z" }
  - id: fact-002
    text: "The installed capability surface reports typed app, workflow, keyboard, control, task, shortcut, authorization-notice, and adapter operations."
    source_ids: [source-repo-readme, source-installed-capabilities]
    temporal_scope: { state: as_of, as_of: "2026-08-12T15:10:45Z" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:10:45Z" }
  - id: fact-003
    text: "Sensitive workflows use a prepare, approve, execute, and verify lifecycle with short-lived single-use authority and redacted receipts."
    source_ids:
      [source-repo-readme, source-tier1-policy, source-installed-capabilities]
    temporal_scope: { state: as_of, as_of: "2026-08-12" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:10:45Z" }
  - id: fact-004
    text: "The repository's Phase 2 benchmark reports a 134.924 ms median for a verified System Settings focus action in the Mac Control lane, with 3 of 3 measured samples passing; the direct System Events lane reports 479.491 ms and the generic GUI lane reports 11814.550 ms under the same named comparison."
    source_ids: [source-benchmark-method, source-benchmark-results]
    temporal_scope: { state: period, start: "2026-08-09", end: "2026-08-09" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:09:30Z" }
  - id: fact-005
    text: "The same Phase 2 report marks the Finder scroll Mac Control and hybrid comparisons as insufficient evidence because measurement was blocked before a comparable passing result was recorded."
    source_ids: [source-benchmark-method, source-benchmark-results]
    temporal_scope: { state: period, start: "2026-08-09", end: "2026-08-09" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:09:30Z" }
  - id: fact-006
    text: "The installed release check observed on 2026-08-12 did not pass: four checks passed, receipt storage failed, and eight checks were blocked, including the daemon socket, daemon identity, daemon permissions, and several daemon-authoritative capability gates."
    source_ids: [source-tier1-policy, source-installed-release-check]
    temporal_scope: { state: as_of, as_of: "2026-08-12T15:10:45Z" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:10:45Z" }
  - id: fact-007
    text: "Pronto currently classifies Mac Control as a public-showcase project with high career signal but missing a 16:9 preview, a public case study, and redacted authorization and outcome proof. Video is an optional enhancement."
    source_ids: [source-pronto-goal, source-showcase-contract]
    temporal_scope: { state: as_of, as_of: "2026-08-12" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:12:30Z" }
  - id: fact-008
    text: "The reviewed Showcase quality bar requires five-second comprehension, immediate product proof, clear AI and human roles, credible evidence, public low-friction access, and coordinated Handshake packaging."
    source_ids: [source-career-ops-quality-bar, source-showcase-contract]
    temporal_scope: { state: as_of, as_of: "2026-08-12" }
    freshness: { state: fresh, accessed_at: "2026-08-12T15:12:30Z" }

