research_coverage:
  schema_version: rdw-research-coverage/v1
  output_type: feature_explainer
  research_depth: standard
  answers:
    - question_id: technical-behavior
      status: answered
      summary: "Mac Control exposes a typed, local control plane for AI agents operating native macOS apps."
      fact_ids: [fact-001, fact-002]
    - question_id: technical-use-case
      status: answered
      summary: "It addresses the gap between an agent's intent and a native GUI action by making authority, dispatch, verification, and evidence explicit."
      fact_ids: [fact-001, fact-003]
    - question_id: technical-mechanism
      status: answered
      summary: "A per-user daemon owns the GUI session; typed CLI requests pass through permission, approval, route, verification, and redacted receipt boundaries."
      fact_ids: [fact-001, fact-002, fact-003]
    - question_id: technical-failure-modes
      status: answered
      summary: "Missing daemon connectivity, permission evidence, ambiguous targets, or failed verification block completion; the current release report demonstrates that boundary."
      fact_ids: [fact-005, fact-006]
    - question_id: technical-example
      status: answered
      summary: "A repository benchmark records a verified System Settings focus action and preserves blocked Finder comparisons instead of ranking incomplete evidence."
      fact_ids: [fact-004, fact-005]
  synthesis:
    thesis: "Mac Control is best presented as an explainable local safety and verification layer between AI intent and native macOS action."
    limitations:
      - "Current release evidence is incomplete and does not support production-readiness language."
      - "The numeric performance result is bounded to one named project-authored benchmark."
      - "Public no-auth access and real capture assets remain unverified."
    examples:
      - "System Settings focus-next-control comparison with a 134.924 ms project-reported median and 3/3 passing samples."
      - "Current release check that keeps missing daemon-authoritative evidence blocked."
    counterevidence:
      - "Finder scroll comparisons were blocked before measurement and remain insufficient evidence."
      - "The current installed release check did not pass."
    alternatives:
      - "Direct system scripting can be faster than generic GUI control for narrow known tasks, but it does not provide the same shared approval, route, receipt, and provider-handoff contract."

extensions:
  feature:
    product: Mac Control
    problem: "AI agents need to operate native macOS interfaces without obscuring who authorized an action, what route ran, whether the result was verified, or what evidence was retained."
    users:
      - AI agent developers
      - operators supervising native macOS automation
      - engineers evaluating safe computer-control systems
    architecture: "A command-line client sends typed requests over an owner-only Unix socket to a per-user daemon that owns GUI interaction, policy checks, execution, verification, and redacted evidence."
    constraints:
      - Requires a logged-in macOS GUI session for native interaction.
      - macOS privacy permissions remain user-controlled.
      - Browser DOM work belongs to a browser provider rather than this native control plane.
      - Missing or ambiguous evidence fails closed.
    risks:
      - GUI state can be ambiguous or stale.
      - Permission or daemon identity drift can invalidate live evidence.
      - A project-authored benchmark can be overgeneralized if its scope is omitted.
    metrics:
      - "134.924 ms median, 3/3 passed, System Settings focus action, project-authored Phase 2 benchmark."
    roadmap_status: shipped
