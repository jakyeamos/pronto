interpretation_notes:
  - "The strongest story is not generic GUI automation; it is an explainable, local control boundary for agent actions."
  - "The internal benchmark is useful as a bounded example, not as a universal speed claim."
  - "The failed current release gate strengthens the case study when presented as evidence of fail-closed design, but it blocks production-readiness wording."

open_questions:
  - "Which public no-auth host will carry the finished case-study page?"
  - "Can a fresh, redacted GUI capture reproduce the approval and verified-outcome sequence outside the restricted agent runtime?"
  - "Which repository URL is approved for public inclusion?"

uncertainties:
  - "The current installed daemon could not be reached from this restricted agent runtime, so daemon-authoritative permissions and several live gates remain blocked."
  - "The benchmark is project-authored evidence and has not been independently reproduced by a third party."
  - "No current public, no-auth case-study URL or finished capture asset was verified."

