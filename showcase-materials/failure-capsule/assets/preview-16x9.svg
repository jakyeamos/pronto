<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Failure Capsule — a failure should travel light</title>
  <desc id="desc">A current development capture shows a failed declared command, redacted output, named omissions, an artifact hash, and inspect-only opening.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="9%" r="55%"><stop offset="0" stop-color="#ff9f68" stop-opacity=".2"/><stop offset="1" stop-color="#171210" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b2b25"/><stop offset="1" stop-color="#2b201f"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#171210"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#fff4ef">
    <text x="112" y="148" font-size="22" font-weight="800" letter-spacing="3" fill="#ff9f68">FAILURE CAPSULE · DEV</text>
    <text x="112" y="286" font-size="76" font-weight="700">A failure should</text>
    <text x="112" y="378" font-size="76" font-weight="700">travel light.</text>
    <text x="112" y="456" font-size="26" fill="#cdbcb7">Capture the bounded failure, remove secrets, and hand</text>
    <text x="112" y="496" font-size="26" fill="#cdbcb7">over a receipt that never pretends to be a replay.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#ffe5dc" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="16" fill="#cdbcb7" letter-spacing="2">CAPTURE · INSPECT-ONLY</text>
      <text x="602" y="58" text-anchor="end" font-size="16" fill="#ffb28c" font-weight="700">FAILED · EXIT 7</text>
      <rect x="42" y="96" width="560" height="132" fill="#171210" fill-opacity=".68" stroke="#ffe5dc" stroke-opacity=".25"/>
      <text x="70" y="136" font-size="16" fill="#ff9f68" font-weight="700">OUTPUT · REDACTED BEFORE SAVE</text>
      <text x="70" y="178" font-size="22" fill="#fff4ef" font-family="Menlo,monospace">TOKEN=[REDACTED]</text>
      <text x="70" y="207" font-size="17" fill="#cdbcb7" font-family="Menlo,monospace">failed fixture</text>
      <rect x="42" y="258" width="560" height="178" fill="#171210" fill-opacity=".68" stroke="#ffe5dc" stroke-opacity=".25"/>
      <text x="70" y="300" font-size="16" fill="#ff9f68" font-weight="700">OMISSIONS</text>
      <text x="70" y="338" font-size="18" fill="#fff4ef">environment</text><text x="282" y="338" font-size="18" fill="#cdbcb7">credentials</text><text x="456" y="338" font-size="18" fill="#cdbcb7">unlisted-files</text>
      <text x="70" y="380" font-size="16" fill="#cdbcb7">allowlisted artifact · report.txt · sha256 recorded</text>
      <text x="70" y="412" font-size="16" fill="#cdbcb7">inspect-only opening · rerun stays explicit</text>
      <rect x="42" y="466" width="560" height="74" fill="#171210" fill-opacity=".68" stroke="#ffe5dc" stroke-opacity=".25"/>
      <text x="70" y="500" font-size="16" fill="#ff9f68" font-weight="700">NEXT ACTION</text>
      <text x="70" y="524" font-size="16" fill="#cdbcb7">review capsule, then explicitly rerun the command</text>
      <text x="42" y="582" font-size="17" fill="#cdbcb7">Current local proof · replay, hosting, and publication remain open</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#988681" letter-spacing="1">FAILURE CAPSULE / CANDIDATE LOCAL MATERIAL</text>
</svg>
