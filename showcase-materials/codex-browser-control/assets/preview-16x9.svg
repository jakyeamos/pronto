<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Codex Browser Control synthetic itinerary preview</title>
  <desc id="desc">A synthetic travel page flows through exact approval and stale-state refusal. Installed browser round trip remains blocked by an extension and native host version mismatch.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#243b49"/><stop offset="0.44" stop-color="#111a21"/><stop offset="1" stop-color="#0d1319"/></linearGradient>
    <linearGradient id="blue" x1="0" x2="1"><stop offset="0" stop-color="#315b78"/><stop offset="1" stop-color="#203d52"/></linearGradient>
    <linearGradient id="mint" x1="0" x2="1"><stop offset="0" stop-color="#1b503f"/><stop offset="1" stop-color="#153227"/></linearGradient>
    <linearGradient id="amber" x1="0" x2="1"><stop offset="0" stop-color="#5c4520"/><stop offset="1" stop-color="#342714"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="100" fill="#9de5c1" font-family="Verdana" font-size="22" font-weight="700" letter-spacing="3">CODEX BROWSER CONTROL · CB-1</text>
  <text x="100" y="180" fill="#f5f7f8" font-family="Verdana" font-size="64" font-weight="700">Browser actions that expire</text>
  <text x="100" y="250" fill="#f5f7f8" font-family="Verdana" font-size="64" font-weight="700">when the page changes.</text>
  <text x="100" y="304" fill="#aab7c1" font-family="Verdana" font-size="25">Synthetic itinerary · exact approval · stale-state refusal</text>

  <rect x="100" y="370" width="380" height="290" rx="24" fill="url(#blue)" stroke="#5b87a5" stroke-width="2"/>
  <text x="130" y="420" fill="#9bd7f1" font-family="Verdana" font-size="17" font-weight="700">01 · OBSERVE</text>
  <text x="130" y="492" fill="#f5f7f8" font-family="Verdana" font-size="32" font-weight="700">Bind the page</text>
  <text x="130" y="548" fill="#d4e5ef" font-family="Andale Mono" font-size="18">role=combobox</text>
  <text x="130" y="580" fill="#d4e5ef" font-family="Andale Mono" font-size="18">name=Seat preference</text>
  <text x="130" y="612" fill="#9bd7f1" font-family="Andale Mono" font-size="17">state=Window · fresh digest</text>

  <path d="M480 515 H555" stroke="#9de5c1" stroke-width="4"/><path d="M543 503 L563 515 L543 527" fill="none" stroke="#9de5c1" stroke-width="4"/>
  <rect x="580" y="370" width="380" height="290" rx="24" fill="url(#mint)" stroke="#2b7556" stroke-width="2"/>
  <text x="610" y="420" fill="#9de5c1" font-family="Verdana" font-size="17" font-weight="700">02 · APPROVE</text>
  <text x="610" y="492" fill="#f5f7f8" font-family="Verdana" font-size="32" font-weight="700">Review once</text>
  <text x="610" y="548" fill="#d4eee1" font-family="Andale Mono" font-size="18">Window → Aisle</text>
  <text x="610" y="580" fill="#d4eee1" font-family="Andale Mono" font-size="18">single-use · exact digest</text>
  <text x="610" y="612" fill="#9de5c1" font-family="Andale Mono" font-size="17">approval_required</text>

  <path d="M960 515 H1035" stroke="#ffd182" stroke-width="4"/><path d="M1023 503 L1043 515 L1023 527" fill="none" stroke="#ffd182" stroke-width="4"/>
  <rect x="1060" y="370" width="440" height="290" rx="24" fill="url(#amber)" stroke="#84652f" stroke-width="2"/>
  <text x="1090" y="420" fill="#ffd182" font-family="Verdana" font-size="17" font-weight="700">03 · STALE REFUSAL</text>
  <text x="1090" y="492" fill="#f5f7f8" font-family="Verdana" font-size="32" font-weight="700">Stop before replay</text>
  <text x="1090" y="548" fill="#f6ead5" font-family="Andale Mono" font-size="18">itinerary changes</text>
  <text x="1090" y="580" fill="#f6ead5" font-family="Andale Mono" font-size="18">target_changed</text>
  <text x="1090" y="612" fill="#ffd182" font-family="Andale Mono" font-size="17">mutation_attempted=false</text>

  <rect x="100" y="735" width="1400" height="76" rx="18" fill="url(#amber)" stroke="#84652f" stroke-width="2"/>
  <text x="130" y="783" fill="#ffd182" font-family="Andale Mono" font-size="19" font-weight="700">INSTALLED BOUNDARY</text>
  <text x="468" y="783" fill="#f6ead5" font-family="Verdana" font-size="22">CB-2 open · extension 0.3.0 vs CLI 0.2.0 · doctor schema mismatch</text>
</svg>
