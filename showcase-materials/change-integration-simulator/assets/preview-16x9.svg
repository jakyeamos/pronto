<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Change Integration Simulator current local evidence</title>
  <desc id="desc">Exact source and target commits produce a clean or conflict merge-tree result while refs remain unchanged.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111a21"/><stop offset="1" stop-color="#202d35"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#29474a"/><stop offset="1" stop-color="#1d2b33"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#111a21"/>
  <circle cx="120" cy="80" r="360" fill="#9be9c1" opacity=".08"/>
  <g font-family="Arial, sans-serif" fill="#f3f6f2">
    <text x="112" y="126" fill="#9be9c1" font-size="19" font-weight="700" letter-spacing="3">CHANGE INTEGRATION · LOCAL</text>
    <text x="112" y="240" font-size="60" font-weight="700">Mergeability is not</text>
    <text x="112" y="322" font-size="60" font-weight="700">verification.</text>
    <text x="112" y="405" fill="#aabdb8" font-size="27">Pin exact commits, simulate the tree,</text>
    <text x="112" y="444" fill="#aabdb8" font-size="27">leave both refs untouched.</text>
    <g filter="url(#shadow)">
      <rect x="900" y="118" width="565" height="630" rx="18" fill="#1d2b33" stroke="#9be9c1" stroke-opacity=".24"/>
    </g>
    <text x="940" y="175" fill="#aabdb8" font-size="18" letter-spacing="3">READ-ONLY SIMULATION</text>
    <text x="940" y="216" font-size="32" font-weight="700">feature → target</text>
    <rect x="940" y="254" width="485" height="104" rx="8" fill="#111a21" stroke="#9be9c1" stroke-opacity=".25"/>
    <text x="972" y="294" fill="#9be9c1" font-size="19" font-weight="700" letter-spacing="2">CLEAN</text>
    <text x="972" y="330" fill="#aabdb8" font-size="20">tree 3481c00d · mergeable</text>
    <rect x="940" y="382" width="485" height="104" rx="8" fill="#111a21" stroke="#ff958b" stroke-opacity=".5"/>
    <text x="972" y="422" fill="#ff958b" font-size="19" font-weight="700" letter-spacing="2">CONFLICT</text>
    <text x="972" y="458" fill="#aabdb8" font-size="20">file.txt · no tree produced</text>
    <rect x="940" y="510" width="485" height="104" rx="8" fill="#111a21" stroke="#ffc878" stroke-opacity=".45"/>
    <text x="972" y="550" fill="#ffc878" font-size="19" font-weight="700" letter-spacing="2">GATE PROBE</text>
    <text x="972" y="586" fill="#aabdb8" font-size="20">separate local check · not Gateboard</text>
    <text x="940" y="686" fill="#9be9c1" font-size="20" font-weight="700">SOURCE / TARGET REFS UNCHANGED</text>
    <text x="112" y="780" fill="#aabdb8" font-size="19">Local evidence only · stale/cancellation breadth, hosting, and publication remain gated.</text>
  </g>
</svg>
