<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Remediation Canvas — keep partial work actionable</title>
  <desc id="desc">A current development canvas shows stable finding references, human dispositions, a next action, and a stale source refresh that preserves partial work.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="8%" r="55%"><stop offset="0" stop-color="#ffc77a" stop-opacity=".2"/><stop offset="1" stop-color="#201912" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4b3923"/><stop offset="1" stop-color="#2b2520"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#201912"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#fff7ec">
    <text x="112" y="148" font-size="22" font-weight="800" letter-spacing="3" fill="#ffc77a">REMEDIATION CANVAS · DEV</text>
    <text x="112" y="286" font-size="76" font-weight="700">Keep partial work</text>
    <text x="112" y="378" font-size="76" font-weight="700">actionable.</text>
    <text x="112" y="456" font-size="26" fill="#d6c6b3">Group the evidence, state the human intent, and make</text>
    <text x="112" y="496" font-size="26" fill="#d6c6b3">source drift visible before the next handoff.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#fff0d5" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="16" fill="#d6c6b3" letter-spacing="2">CANVAS · FINDING REFERENCES</text>
      <text x="602" y="58" text-anchor="end" font-size="16" fill="#9fe6bd" font-weight="700">STALE</text>
      <rect x="42" y="96" width="560" height="214" fill="#201912" fill-opacity=".72" stroke="#fff0d5" stroke-opacity=".25"/>
      <text x="70" y="134" font-size="16" fill="#ffc77a" font-weight="700">GROUP · GROUP-1</text>
      <text x="70" y="176" font-size="18" fill="#fff7ec" font-family="Menlo,monospace">QL-FIX-001</text><text x="278" y="176" font-size="17" fill="#9fe6bd">resolved</text>
      <text x="70" y="216" font-size="18" fill="#fff7ec" font-family="Menlo,monospace">QL-FIX-002</text><text x="278" y="216" font-size="17" fill="#ffca80">blocked</text>
      <text x="70" y="256" font-size="18" fill="#fff7ec" font-family="Menlo,monospace">QL-FIX-003</text><text x="278" y="256" font-size="17" fill="#d6c6b3">unresolved</text>
      <text x="70" y="292" font-size="16" fill="#d6c6b3">next action · QL-FIX-001</text>
      <rect x="42" y="338" width="560" height="142" fill="#201912" fill-opacity=".72" stroke="#fff0d5" stroke-opacity=".25"/>
      <text x="70" y="376" font-size="16" fill="#ffc77a" font-weight="700">HUMAN INTENT</text>
      <text x="70" y="414" font-size="18" fill="#fff7ec">Needs a focused fixture before apply</text>
      <text x="70" y="450" font-size="16" fill="#d6c6b3">references only · producer remains Quality Lens</text>
      <rect x="42" y="508" width="560" height="54" fill="#201912" fill-opacity=".72" stroke="#fff0d5" stroke-opacity=".25"/>
      <text x="70" y="542" font-size="16" fill="#ffca80" font-weight="700">STALE</text>
      <text x="136" y="542" font-size="16" fill="#d6c6b3">QL-FIX-003 replaced by QL-FIX-004 · work preserved</text>
      <text x="42" y="600" font-size="17" fill="#d6c6b3">Current local proof · verification and review handoff remain open</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#a18e7b" letter-spacing="1">REMEDIATION CANVAS / CANDIDATE LOCAL MATERIAL</text>
</svg>
