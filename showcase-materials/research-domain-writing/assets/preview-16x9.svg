<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Verdana, sans-serif">
  <title id="title">Research Domain Writing: plausible is not proven</title>
  <desc id="desc">A real Jayson Tatum season line is preserved while an unsupported elite two-way inference is stopped and repaired.</desc>
  <rect width="1600" height="900" fill="#f4f0e7"/>
  <circle cx="1500" cy="80" r="320" fill="#d9ed92" opacity=".34"/>
  <text x="74" y="76" font-size="15" font-weight="800" letter-spacing="2.4" fill="#2a7358">RESEARCH DOMAIN WRITING · CANDIDATE LOCAL PREVIEW</text>
  <text x="74" y="190" font-family="Verdana" font-size="76" font-weight="500" fill="#153f32">Plausible is</text>
  <text x="74" y="270" font-family="Verdana" font-size="76" font-weight="500" fill="#153f32">not proven.</text>
  <text x="74" y="322" font-size="22" fill="#65706a">Keep the useful fact. Stop the unsupported leap.</text>
  <rect x="74" y="382" width="700" height="284" fill="#fffdf8" stroke="#d1d0c7"/>
  <text x="106" y="426" font-size="14" font-weight="800" letter-spacing="1.8" fill="#65706a">REAL SOURCE PACKET · TATUM 2023–24</text>
  <text x="106" y="490" font-family="Georgia, serif" font-size="30" fill="#17201c">74 games · 26.9 PPG · 8.1 RPG · 4.9 APG</text>
  <line x1="106" y1="526" x2="742" y2="526" stroke="#d1d0c7"/>
  <text x="106" y="568" font-size="18" fill="#65706a">Supported box-score line</text>
  <text x="106" y="614" font-size="18" font-weight="700" fill="#a94235">“Those numbers prove he was an elite two-way engine.”</text>
  <text x="106" y="648" font-size="16" fill="#a94235">Stopped · efficiency and defensive-impact evidence is missing</text>
  <rect x="842" y="146" width="684" height="542" rx="3" fill="#153f32"/>
  <text x="882" y="198" font-size="14" font-weight="800" letter-spacing="1.8" fill="#d9ed92">CLAIM TRACE · QA RECEIPT</text>
  <rect x="882" y="236" width="604" height="118" fill="#214f40"/>
  <text x="914" y="278" font-size="16" font-weight="800" fill="#d9ed92">1 · PRESERVE</text>
  <text x="914" y="314" font-size="18" fill="#fffdf8">The recorded season line stays in the draft.</text>
  <rect x="882" y="378" width="604" height="118" fill="#7c332d"/>
  <text x="914" y="420" font-size="16" font-weight="800" fill="#ffd0c5">2 · STOP</text>
  <text x="914" y="456" font-size="18" fill="#fffdf8">The overclaim cannot map to a loaded fact.</text>
  <rect x="882" y="520" width="604" height="118" fill="#214f40"/>
  <text x="914" y="562" font-size="16" font-weight="800" fill="#d9ed92">3 · REPAIR</text>
  <text x="914" y="598" font-size="18" fill="#fffdf8">Narrow the conclusion; human publication remains.</text>
  <line x1="74" y1="768" x2="1526" y2="768" stroke="#2a7358" stroke-width="2"/>
  <text x="74" y="814" font-size="16" fill="#65706a">Real case · semantic QA stop · deterministic exact-draft receipt</text>
  <text x="1262" y="814" font-size="14" font-weight="800" letter-spacing="1.2" fill="#a94235">RDW-0 OPEN</text>
</svg>
