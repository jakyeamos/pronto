<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Debug Trail: leave the question behind</title>
  <desc id="desc">A crop-safe showcase frame showing a target-bound hypothesis, authorized experiment, bounded evidence, and rerunnable next step.</desc>
  <defs>
    <radialGradient id="glow" cx="22%" cy="5%" r="48%">
      <stop offset="0" stop-color="#33496d" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#111218" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27364e"/>
      <stop offset="1" stop-color="#1b202c"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#111218"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Helvetica" fill="#f6f3ee">
    <text x="112" y="154" fill="#9dc8ff" font-size="22" font-weight="700" letter-spacing="4">DEBUG TRAIL · W1 PILOT</text>
    <text x="112" y="274" text-anchor="start" font-size="72" font-weight="700">Leave the</text>
    <text x="112" y="366" text-anchor="start" font-size="72" font-weight="700">question behind.</text>
    <text x="112" y="442" fill="#b7b8c3" font-size="25">Turn one bounded experiment into evidence an inheritor</text>
    <text x="112" y="480" fill="#b7b8c3" font-size="25">can inspect and rerun without reconstructing the conversation.</text>
    <text x="112" y="700" fill="#858793" font-size="18" letter-spacing="1">CANDIDATE LOCAL MATERIAL · IDE CONTINUITY OPEN</text>
  </g>
  <g transform="translate(870 112)">
    <rect width="606" height="656" rx="24" fill="url(#card)" stroke="#c4d1e6" stroke-opacity="0.25"/>
    <text x="42" y="58" fill="#b7b8c3" font-family="Helvetica" font-size="16" letter-spacing="2">FIXTURE INVESTIGATION</text>
    <text x="564" y="58" text-anchor="end" fill="#f4c76d" font-family="Helvetica" font-size="16" font-weight="700">FRESH TARGET</text>
    <rect x="42" y="96" width="522" height="232" rx="8" fill="#111218" fill-opacity="0.66" stroke="#9dc8ff" stroke-opacity="0.7"/>
    <rect x="42" y="96" width="5" height="232" rx="2" fill="#9dc8ff"/>
    <text x="72" y="148" fill="#f6f3ee" font-family="Helvetica" font-size="23" font-weight="700">The deterministic fixture check passes</text>
    <text x="72" y="198" fill="#b7b8c3" font-family="Helvetica" font-size="18">Preview the declared read-only command,</text>
    <text x="72" y="228" fill="#b7b8c3" font-family="Helvetica" font-size="18">authorize it explicitly, and keep evidence bounded.</text>
    <text x="72" y="282" fill="#9dc8ff" font-family="SFMono-Regular" font-size="15">node scripts/check.mjs · mutation: read-only</text>
    <line x1="42" y1="372" x2="564" y2="372" stroke="#c4d1e6" stroke-opacity="0.25"/>
    <text x="42" y="420" fill="#b7b8c3" font-family="Helvetica" font-size="15" letter-spacing="1">RECEIPT OUTCOME</text>
    <text x="42" y="460" fill="#9dc8ff" font-family="Helvetica" font-size="22" font-weight="700">passed · token redacted</text>
    <text x="42" y="516" fill="#b7b8c3" font-family="Helvetica" font-size="15" letter-spacing="1">CONTINUATION</text>
    <text x="42" y="556" fill="#f6f3ee" font-family="Helvetica" font-size="20">Rerun if the target revision changes</text>
    <text x="42" y="620" fill="#858793" font-family="Helvetica" font-size="14">Local receipt · source location · full-output hash</text>
  </g>
</svg>
