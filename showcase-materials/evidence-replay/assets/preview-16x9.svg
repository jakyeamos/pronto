<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence Replay — a pass can go stale</title>
  <desc id="desc">A current development checkpoint shows a historical pass, a stale target, a not-run current outcome, and an explicit blocked rerun preview.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="7%" r="52%"><stop offset="0" stop-color="#8ee8f1" stop-opacity=".18"/><stop offset="1" stop-color="#10151f" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c374d"/><stop offset="1" stop-color="#1a2635"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#10151f"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#f2f6fb">
    <text x="112" y="148" font-size="22" font-weight="800" letter-spacing="3" fill="#8ee8f1">EVIDENCE REPLAY · DEV</text>
    <text x="112" y="290" font-size="82" font-weight="700">A pass can</text>
    <text x="112" y="382" font-size="82" font-weight="700">go stale.</text>
    <text x="112" y="458" font-size="26" fill="#b1bfcc">Open the receipt, compare its target, and keep the rerun</text>
    <text x="112" y="498" font-size="26" fill="#b1bfcc">behind an explicit human decision.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#d4e7f7" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="16" fill="#b1bfcc" letter-spacing="2">DEBUG TRAIL · RECEIPT</text>
      <text x="602" y="58" text-anchor="end" font-size="16" fill="#ffb66d" font-weight="700">STALE · NOT-RUN</text>
      <rect x="42" y="96" width="560" height="142" fill="#10151f" fill-opacity=".68" stroke="#d4e7f7" stroke-opacity=".25"/>
      <text x="70" y="138" font-size="17" fill="#8ee8f1" font-weight="700">HISTORICAL OUTCOME</text>
      <text x="70" y="184" font-size="28" fill="#f2f6fb" font-weight="700">PASSED</text>
      <text x="242" y="184" font-size="17" fill="#b1bfcc">fixture revision · current target differs</text>
      <rect x="42" y="268" width="560" height="214" fill="#10151f" fill-opacity=".68" stroke="#d4e7f7" stroke-opacity=".25"/>
      <line x1="322" y1="268" x2="322" y2="482" stroke="#d4e7f7" stroke-opacity=".25"/>
      <text x="70" y="310" font-size="16" fill="#8ee8f1" font-weight="700">CURRENT CHECK</text>
      <text x="70" y="352" font-size="23" fill="#ffb66d" font-weight="700">NOT-RUN</text>
      <text x="70" y="390" font-size="16" fill="#b1bfcc">revision drift stays visible</text>
      <text x="350" y="310" font-size="16" fill="#8ee8f1" font-weight="700">RERUN PREVIEW</text>
      <text x="350" y="352" font-size="23" fill="#ffb66d" font-weight="700">BLOCKED</text>
      <text x="350" y="390" font-size="16" fill="#b1bfcc">review + authorize first</text>
      <text x="42" y="540" font-size="17" fill="#b1bfcc">Opening executes nothing · omissions remain explicit</text>
      <text x="42" y="576" font-size="17" fill="#7f93a5">Local proof · producer matrix and hosted reader remain open</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7f93a5" letter-spacing="1">EVIDENCE REPLAY / CANDIDATE LOCAL MATERIAL</text>
</svg>
