<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Quality Setup — every setup has a way back</title>
  <desc id="desc">A four-step repository-local setup flow: inspect, preview, apply, and verify with rollback ready.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="8%" r="55%"><stop offset="0" stop-color="#9ee0a9" stop-opacity=".18"/><stop offset="1" stop-color="#101513" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#224231"/><stop offset="1" stop-color="#1a2821"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#101513"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#f5f5ed">
    <text x="112" y="148" font-size="24" font-weight="800" letter-spacing="5" fill="#9ee0a9">QUALITY SETUP · W1 ENABLER</text>
    <text x="112" y="290" font-size="92" font-weight="700">Every setup</text>
    <text x="112" y="382" font-size="92" font-weight="700">has a way back.</text>
    <text x="112" y="458" font-size="26" fill="#b2c0b6">Preview the owned change, apply it with authority,</text>
    <text x="112" y="498" font-size="26" fill="#b2c0b6">verify what landed, and leave a rollback receipt.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#c9e4cf" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="18" fill="#b2c0b6" letter-spacing="2">NODE · PNPM TARGET</text>
      <text x="470" y="58" font-size="17" fill="#f4c76d" font-weight="700">ROLLBACK READY</text>
      <g transform="translate(42 96)">
        <rect width="560" height="360" fill="#101513" fill-opacity=".62" stroke="#c9e4cf" stroke-opacity=".25"/>
        <line x1="140" y1="0" x2="140" y2="360" stroke="#c9e4cf" stroke-opacity=".25"/>
        <line x1="280" y1="0" x2="280" y2="360" stroke="#c9e4cf" stroke-opacity=".25"/>
        <line x1="420" y1="0" x2="420" y2="360" stroke="#c9e4cf" stroke-opacity=".25"/>
        <g fill="#9ee0a9" font-size="20" font-weight="700">
          <text x="24" y="50">01</text><text x="164" y="50">02</text><text x="304" y="50">03</text><text x="444" y="50">04</text>
        </g>
        <g fill="#f5f5ed" font-size="19">
          <text x="24" y="92">Inspect</text><text x="164" y="92">Preview</text><text x="304" y="92">Apply</text><text x="444" y="92">Verify</text>
        </g>
        <g fill="#b2c0b6" font-size="16">
          <text x="24" y="137">supported</text><text x="24" y="163">ecosystem</text>
          <text x="164" y="137">one owned</text><text x="164" y="163">config</text>
          <text x="304" y="137">explicit</text><text x="304" y="163">authority</text>
          <text x="444" y="137">receipt +</text><text x="444" y="163">recovery</text>
        </g>
        <g stroke="#9ee0a9" stroke-width="3" fill="none"><path d="M30 268h80"/><path d="M170 268h80"/><path d="M310 268h80"/><path d="M450 268h70"/></g>
        <g fill="#9ee0a9"><circle cx="30" cy="268" r="7"/><circle cx="170" cy="268" r="7"/><circle cx="310" cy="268" r="7"/><circle cx="450" cy="268" r="7"/><circle cx="520" cy="268" r="7"/></g>
        <text x="24" y="322" fill="#f4c76d" font-size="17">conflict → refuse, do not overwrite</text>
      </g>
      <text x="42" y="508" font-size="17" fill="#b2c0b6">Current local proof · clean dev headless flow</text>
      <text x="42" y="542" font-size="17" fill="#b2c0b6">Broader ecosystems and hosted delivery remain open.</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#7f9584">QUALITY SETUP / CANDIDATE LOCAL MATERIAL</text>
</svg>
