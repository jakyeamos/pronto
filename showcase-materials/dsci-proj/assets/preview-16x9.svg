<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Dsci-proj synthetic decision contract preview</title>
  <desc id="desc">Two backlog shapes flow into one decision contract with an explicit adapter gate.</desc>
  <rect width="1600" height="900" fill="#0b101b"/><circle cx="1360" cy="0" r="480" fill="#394578" opacity=".58"/>
  <text x="72" y="76" fill="#8ee8c3" font-family="Arial" font-size="14" font-weight="700">DSCI-PROJ · CANDIDATE LOCAL PREVIEW</text>
  <text x="72" y="156" fill="#f4f6fb" font-family="Arial" font-size="67" font-weight="700">Normalize the backlog</text><text x="72" y="224" fill="#f4f6fb" font-family="Arial" font-size="67" font-weight="700">before asking what comes next.</text>
  <text x="72" y="268" fill="#aab6c9" font-family="Arial" font-size="22">Two source shapes. One decision contract. Criteria and final judgment stay with the user.</text>
  <g transform="translate(72 315)">
    <rect width="430" height="112" fill="#141e32" stroke="#40516b"/><text x="22" y="32" fill="#f2c77c" font-family="Arial" font-size="12" font-weight="700">SOURCE A</text><text x="22" y="70" fill="#f4f6fb" font-family="Arial" font-size="20">Research issue backlog</text>
    <rect x="442" width="430" height="112" fill="#1d2941" stroke="#40516b"/><text x="464" y="32" fill="#f2c77c" font-family="Arial" font-size="12" font-weight="700">SOURCE B</text><text x="464" y="70" fill="#f4f6fb" font-family="Arial" font-size="20">Product backlog</text>
    <rect x="884" width="430" height="112" fill="#2a2430" stroke="#40516b"/><text x="906" y="32" fill="#f2c77c" font-family="Arial" font-size="12" font-weight="700">CONTRACT</text><text x="906" y="70" fill="#f4f6fb" font-family="Arial" font-size="20">Canonical item + evidence</text>
  </g>
  <g transform="translate(72 469)">
    <rect width="330" height="190" fill="#121c2f" stroke="#40516b"/><text x="22" y="35" fill="#8ee8c3" font-family="Arial" font-size="12" font-weight="700">01 · INPUTS</text><text x="22" y="82" fill="#f4f6fb" font-family="Arial" font-size="25" font-weight="700">Different fields</text><text x="22" y="123" fill="#d5ddeb" font-family="Arial" font-size="16">State, title, evidence, and</text><text x="22" y="147" fill="#d5ddeb" font-family="Arial" font-size="16">source type mean different things.</text>
    <rect x="342" width="348" height="190" fill="#172540" stroke="#40516b"/><text x="364" y="35" fill="#8ee8c3" font-family="Arial" font-size="12" font-weight="700">02 · NORMALIZE</text><text x="364" y="82" fill="#f4f6fb" font-family="Arial" font-size="25" font-weight="700">One item model</text><text x="364" y="123" fill="#d5ddeb" font-family="Arial" font-size="16">Canonical fields become explicit</text><text x="364" y="147" fill="#d5ddeb" font-family="Arial" font-size="16">before a priority score is considered.</text>
    <rect x="700" width="348" height="190" fill="#1f2c49" stroke="#40516b"/><text x="722" y="35" fill="#8ee8c3" font-family="Arial" font-size="12" font-weight="700">03 · EXPLAIN</text><text x="722" y="82" fill="#f4f6fb" font-family="Arial" font-size="25" font-weight="700">User-owned criteria</text><text x="722" y="123" fill="#d5ddeb" font-family="Arial" font-size="16">Weights and missing-input rules</text><text x="722" y="147" fill="#d5ddeb" font-family="Arial" font-size="16">keep judgment inspectable.</text>
    <rect x="1058" width="372" height="190" fill="#3b2834" stroke="#40516b"/><text x="1080" y="35" fill="#f2a9b9" font-family="Arial" font-size="12" font-weight="700">04 · DS-1 OPEN</text><text x="1080" y="82" fill="#f4f6fb" font-family="Arial" font-size="25" font-weight="700">Adapter proof</text><text x="1080" y="123" fill="#e4e7ef" font-family="Arial" font-size="16">Generalized implementation</text><text x="1080" y="147" fill="#e4e7ef" font-family="Arial" font-size="16">and live scenario remain open.</text>
  </g>
  <g transform="translate(72 701)"><rect width="710" height="92" fill="#35252f" stroke="#40516b"/><text x="22" y="31" fill="#f2a9b9" font-family="Arial" font-size="12" font-weight="700">APPENDIX ONLY</text><text x="22" y="63" fill="#e4e7ef" font-family="Arial" font-size="16">Synthetic mapping · no production backlog or current queue</text><rect x="722" width="708" height="92" fill="#282e42" stroke="#40516b"/><text x="744" y="31" fill="#f2a9b9" font-family="Arial" font-size="12" font-weight="700">CLAIM BOUNDARY</text><text x="744" y="63" fill="#e4e7ef" font-family="Arial" font-size="16">Contract proven locally; product behavior is not claimed</text></g>
  <line x1="72" y1="831" x2="1528" y2="831" stroke="#8ee8c3" stroke-width="2"/><text x="72" y="863" fill="#aab6c9" font-family="Arial" font-size="14">Synthetic showcase fixture · not current product output</text><text x="1368" y="863" fill="#f2a9b9" font-family="Arial" font-size="14" font-weight="700">CANDIDATE LOCAL</text>
</svg>
