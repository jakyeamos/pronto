<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Portable Agentic Workbench safe-tool-guards preview</title>
  <desc id="desc">A public safety contract branches through a dry-run into generic and Codex native projections, then returns through receipt-scoped recovery. Host runtime equivalence is explicitly blocked by the no-provider boundary.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#243644"/>
      <stop offset="0.46" stop-color="#10171c"/>
      <stop offset="1" stop-color="#0d1114"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" x2="1">
      <stop offset="0" stop-color="#365a80"/>
      <stop offset="1" stop-color="#263f59"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1">
      <stop offset="0" stop-color="#1c503d"/>
      <stop offset="1" stop-color="#153027"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" x2="1">
      <stop offset="0" stop-color="#58431f"/>
      <stop offset="1" stop-color="#342714"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="100" y="100" fill="#a9c7ff" font-family="Menlo, monospace" font-size="22" font-weight="700" letter-spacing="3">PORTABLE AGENTIC WORKBENCH · PW-1</text>
  <text x="100" y="180" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="66" font-weight="700">Carry the safety contract</text>
  <text x="100" y="250" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="66" font-weight="700">without hiding the edge.</text>
  <text x="100" y="302" fill="#9eabb0" font-family="Arial, sans-serif" font-size="25">One public workflow · two clean targets · preview before persistence</text>

  <rect x="100" y="370" width="280" height="300" rx="24" fill="url(#blue)" stroke="#496988" stroke-width="2"/>
  <text x="130" y="420" fill="#a9c7ff" font-family="Menlo, monospace" font-size="17" font-weight="700">01 · MANIFEST</text>
  <text x="130" y="490" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="32" font-weight="700">safe-tool-</text>
  <text x="130" y="528" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="32" font-weight="700">guards</text>
  <text x="130" y="580" fill="#d3e2ee" font-family="Menlo, monospace" font-size="17">CONTRACT.md</text>
  <text x="130" y="610" fill="#d3e2ee" font-family="Menlo, monospace" font-size="17">WORKFLOW.md</text>

  <path d="M380 520 H470" stroke="#a9c7ff" stroke-width="4"/>
  <path d="M458 508 L478 520 L458 532" fill="none" stroke="#a9c7ff" stroke-width="4"/>
  <rect x="500" y="370" width="280" height="300" rx="24" fill="url(#green)" stroke="#2b7556" stroke-width="2"/>
  <text x="530" y="420" fill="#8fe0b6" font-family="Menlo, monospace" font-size="17" font-weight="700">02 · DRY-RUN</text>
  <text x="530" y="492" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="32" font-weight="700">preview first</text>
  <text x="530" y="554" fill="#d4eee1" font-family="Menlo, monospace" font-size="18">would-copy × 2</text>
  <text x="530" y="588" fill="#d4eee1" font-family="Menlo, monospace" font-size="18">mutation: none</text>
  <text x="530" y="622" fill="#8fe0b6" font-family="Menlo, monospace" font-size="16">manual review visible</text>

  <path d="M780 470 H860" stroke="#8fe0b6" stroke-width="4"/>
  <path d="M848 458 L868 470 L848 482" fill="none" stroke="#8fe0b6" stroke-width="4"/>
  <path d="M780 570 H860" stroke="#8fe0b6" stroke-width="4"/>
  <path d="M848 558 L868 570 L848 582" fill="none" stroke="#8fe0b6" stroke-width="4"/>

  <rect x="890" y="370" width="240" height="300" rx="24" fill="url(#green)" stroke="#2b7556" stroke-width="2"/>
  <text x="920" y="420" fill="#8fe0b6" font-family="Menlo, monospace" font-size="17" font-weight="700">03 · GENERIC</text>
  <text x="920" y="500" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="31" font-weight="700">native</text>
  <text x="920" y="552" fill="#d4eee1" font-family="Menlo, monospace" font-size="17">copied: 2</text>
  <text x="920" y="586" fill="#d4eee1" font-family="Menlo, monospace" font-size="17">hashes: match</text>
  <text x="920" y="620" fill="#8fe0b6" font-family="Menlo, monospace" font-size="16">status: ready</text>

  <rect x="1160" y="370" width="240" height="300" rx="24" fill="url(#green)" stroke="#2b7556" stroke-width="2"/>
  <text x="1190" y="420" fill="#8fe0b6" font-family="Menlo, monospace" font-size="17" font-weight="700">04 · CODEX</text>
  <text x="1190" y="500" fill="#f1f5f3" font-family="Arial, sans-serif" font-size="31" font-weight="700">native</text>
  <text x="1190" y="552" fill="#d4eee1" font-family="Menlo, monospace" font-size="17">copied: 2</text>
  <text x="1190" y="586" fill="#d4eee1" font-family="Menlo, monospace" font-size="17">registration: manual</text>
  <text x="1190" y="620" fill="#8fe0b6" font-family="Menlo, monospace" font-size="16">status: ready</text>

  <rect x="100" y="735" width="1300" height="76" rx="18" fill="url(#amber)" stroke="#84652f" stroke-width="2"/>
  <text x="130" y="783" fill="#f3c77b" font-family="Menlo, monospace" font-size="19" font-weight="700">HONEST BOUNDARY</text>
  <text x="430" y="783" fill="#f6ead5" font-family="Arial, sans-serif" font-size="22">receipt-scoped recovery proven · PW-4 blocked by host-runtime boundary</text>
</svg>
