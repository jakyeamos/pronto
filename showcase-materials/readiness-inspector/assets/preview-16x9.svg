<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Readiness Inspector current local evidence</title>
  <desc id="desc">A versioned goal keeps passing, failed, blocked, and unsupported checks separate and target-bound without an aggregate score.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#25313a"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".34"/></filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="360" fill="#a5e4c5" opacity=".09"/>
  <g font-family="Arial, sans-serif" fill="#eef7f3">
    <text x="112" y="126" fill="#a5e4c5" font-size="19" font-weight="700" letter-spacing="3">READINESS INSPECTOR · LOCAL</text>
    <text x="112" y="240" font-size="66" font-weight="700">Ready for</text>
    <text x="112" y="322" font-size="66" font-weight="700">what?</text>
    <text x="112" y="405" fill="#a8b8b5" font-size="27">Declare the goal, preserve every predicate,</text>
    <text x="112" y="444" fill="#a8b8b5" font-size="27">and never average uncertainty away.</text>
    <g filter="url(#shadow)">
      <rect x="855" y="118" width="610" height="630" rx="18" fill="#1d2934" stroke="#a5e4c5" stroke-opacity=".24"/>
    </g>
    <text x="900" y="175" fill="#a8b8b5" font-size="18" letter-spacing="2">CONTINUATION HANDOFF</text>
    <text x="900" y="216" font-size="32" font-weight="700">target 2efa5ed6</text>
    <rect x="900" y="254" width="520" height="96" rx="8" fill="#111820" stroke="#a5e4c5" stroke-opacity=".25"/>
    <text x="934" y="294" fill="#a5e4c5" font-size="19" font-weight="700" letter-spacing="2">PASSED</text>
    <text x="934" y="330" fill="#a8b8b5" font-size="20">tests + standards · receipt retained</text>
    <rect x="900" y="370" width="520" height="96" rx="8" fill="#111820" stroke="#ff9f98" stroke-opacity=".42"/>
    <text x="934" y="410" fill="#ff9f98" font-size="19" font-weight="700" letter-spacing="2">FAILED</text>
    <text x="934" y="446" fill="#a8b8b5" font-size="20">failed predicates remain individual</text>
    <rect x="900" y="486" width="520" height="96" rx="8" fill="#111820" stroke="#ffd083" stroke-opacity=".48"/>
    <text x="934" y="526" fill="#ffd083" font-size="19" font-weight="700" letter-spacing="2">BLOCKED</text>
    <text x="934" y="562" fill="#a8b8b5" font-size="20">mutating check needs separate authority</text>
    <rect x="900" y="602" width="520" height="96" rx="8" fill="#111820" stroke="#a5e4c5" stroke-opacity=".25"/>
    <text x="934" y="642" fill="#a5e4c5" font-size="19" font-weight="700" letter-spacing="2">UNSUPPORTED</text>
    <text x="934" y="678" fill="#a8b8b5" font-size="20">unknown check id · no inferred readiness</text>
    <text x="112" y="780" fill="#a8b8b5" font-size="19">Current local material · upstream projection, native follow-up, hosting, and publication remain gated.</text>
  </g>
</svg>
