<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc" font-family="Arial">
  <title id="title">Marketing Autoresearch: Evidence before publish</title>
  <desc id="desc">A real public portfolio brief moves through a report-only probe and stops at a missing brief-aware runtime contract.</desc>
  <defs>
    <radialGradient id="glow" cx="86%" cy="0%" r="58%"><stop offset="0" stop-color="#30305d"/><stop offset="1" stop-color="#0e1118" stop-opacity="0"/></radialGradient>
    <linearGradient id="rule" x1="0" x2="1"><stop offset="0" stop-color="#8ce7df"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#0e1118"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
    <text x="72" y="83" fill="#8ce7df" font-size="14" font-weight="700" letter-spacing="3">MARKETING AUTORESEARCH · CANDIDATE LOCAL PREVIEW</text>
    <text x="72" y="165" fill="#f4f7fb" font-size="72" font-weight="700">Evidence before publish.</text>
    <text x="72" y="210" fill="#aeb9c8" font-size="21">Real brief. Allowed sources. No invented result.</text>
    <rect x="72" y="260" width="860" height="150" fill="#171d28" stroke="#344052"/>
    <rect x="933" y="260" width="595" height="150" fill="#1e2634" stroke="#344052"/>
    <text x="98" y="298" fill="#ffd48a" font-size="12" font-weight="700" letter-spacing="2">MA-1 · REAL PUBLIC PORTFOLIO QUESTION</text>
    <text x="98" y="340" fill="#f4f7fb" font-size="20">Which AI Showcase story should be foregrounded next,</text>
    <text x="98" y="371" fill="#f4f7fb" font-size="20">and what proof gap most limits trust?</text>
    <text x="960" y="298" fill="#ffd48a" font-size="12" font-weight="700" letter-spacing="2">ALLOWED SOURCE REGISTRY</text>
    <text x="960" y="341" fill="#c4b5fd" font-size="18">portfolio-readme</text>
    <text x="960" y="371" fill="#c4b5fd" font-size="18">project-records · public docs</text>
    <rect x="72" y="451" width="1456" height="150" fill="#344052"/>
    <rect x="73" y="452" width="363" height="148" fill="#161c27"/>
    <rect x="437" y="452" width="363" height="148" fill="#1c2230"/>
    <rect x="801" y="452" width="363" height="148" fill="#20283a"/>
    <rect x="1165" y="452" width="362" height="148" fill="#3c262d"/>
    <text x="98" y="489" fill="#8ce7df" font-size="12" font-weight="700" letter-spacing="2">BRIEF</text>
    <text x="98" y="535" fill="#e0e6ee" font-size="19">Decision, lanes,</text>
    <text x="98" y="565" fill="#e0e6ee" font-size="19">and stop conditions</text>
    <text x="462" y="489" fill="#8ce7df" font-size="12" font-weight="700" letter-spacing="2">PROBE</text>
    <text x="462" y="535" fill="#e0e6ee" font-size="19">Report-only run</text>
    <text x="462" y="565" fill="#e0e6ee" font-size="19">0 external mutations</text>
    <text x="826" y="489" fill="#8ce7df" font-size="12" font-weight="700" letter-spacing="2">REPORT</text>
    <text x="826" y="535" fill="#e0e6ee" font-size="19">Source-to-claim</text>
    <text x="826" y="565" fill="#e0e6ee" font-size="19">receipt required</text>
    <text x="1190" y="489" fill="#ffb5aa" font-size="12" font-weight="700" letter-spacing="2">MA-2 BLOCKED</text>
    <text x="1190" y="535" fill="#f4f7fb" font-size="19">Runtime contract</text>
    <text x="1190" y="565" fill="#f4f7fb" font-size="19">is missing</text>
    <line x1="72" y1="665" x2="1528" y2="665" stroke="url(#rule)" stroke-width="2"/>
    <text x="72" y="719" fill="#ffd48a" font-size="13" font-weight="700" letter-spacing="2">CLAIM BOUNDARY</text>
    <text x="72" y="767" fill="#f4f7fb" font-size="30" font-weight="700">Unknown is safer than a polished fiction.</text>
    <text x="72" y="817" fill="#aeb9c8" font-size="17">Privacy-reviewed local packet · audience demand, research result, hosting, and publication remain unclaimed</text>
    <text x="1528" y="817" text-anchor="end" fill="#ffb5aa" font-size="13" font-weight="700" letter-spacing="2">CANDIDATE LOCAL</text>
</svg>
