<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Book synthetic reading-to-media preview</title>
  <desc id="desc">A synthetic chapter moves through four beats with reader controls and an open rights gate.</desc>
  <rect width="1600" height="900" fill="#161217"/><circle cx="220" cy="40" r="470" fill="#614630" opacity=".6"/><circle cx="1420" cy="760" r="420" fill="#2d524a" opacity=".56"/>
  <text x="72" y="76" fill="#efbf78" font-family="Arial" font-size="14" font-weight="700">BOOK · CANDIDATE LOCAL PREVIEW</text>
  <text x="72" y="156" fill="#f5f0e7" font-family="Arial" font-size="70" font-weight="400">Let motion follow</text><text x="72" y="224" fill="#f5f0e7" font-family="Arial" font-size="70" font-weight="400">the prose.</text>
  <text x="72" y="268" fill="#b9b1a6" font-family="Arial" font-size="22">A synthetic chapter moves from quiet page to audiovisual threshold, then returns control to the reader.</text>
  <g transform="translate(72 315)">
    <rect width="800" height="250" fill="#272126" stroke="#66565e"/><text x="28" y="38" fill="#9fceb6" font-family="Arial" font-size="12" font-weight="700">THE SIGNAL ROOM · SYNTHETIC SHOWCASE FIXTURE</text><text x="28" y="142" fill="#f5f0e7" font-family="Georgia,serif" font-size="34">At dusk, the room kept one small</text><text x="28" y="185" fill="#f5f0e7" font-family="Georgia,serif" font-size="34">promise: the signal would return.</text>
    <rect x="816" width="614" height="250" fill="#322a31" stroke="#66565e"/><text x="844" y="38" fill="#9fceb6" font-family="Arial" font-size="12" font-weight="700">MANIFEST BEATS</text>
    <rect x="844" y="72" width="272" height="65" fill="#211b20" stroke="#66565e"/><text x="862" y="98" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">QUIET</text><text x="862" y="121" fill="#b9b1a6" font-family="Arial" font-size="13">Meet the prose</text>
    <rect x="1126" y="72" width="272" height="65" fill="#3a2d2d" stroke="#66565e"/><text x="1144" y="98" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">THRESHOLD</text><text x="1144" y="121" fill="#b9b1a6" font-family="Arial" font-size="13">Motion enters</text>
    <rect x="844" y="148" width="272" height="65" fill="#3b3431" stroke="#66565e"/><text x="862" y="174" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">TRANSFORM</text><text x="862" y="197" fill="#b9b1a6" font-family="Arial" font-size="13">Layer peaks</text>
    <rect x="1126" y="148" width="272" height="65" fill="#273a33" stroke="#66565e"/><text x="1144" y="174" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">EXIT</text><text x="1144" y="197" fill="#b9b1a6" font-family="Arial" font-size="13">Reader regains control</text>
  </g>
  <g transform="translate(72 599)">
    <rect width="348" height="102" fill="#211b20" stroke="#66565e"/><text x="22" y="32" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">MUTE</text><text x="22" y="64" fill="#e7dfd6" font-family="Arial" font-size="16">Sound stays optional</text>
    <rect x="360" width="348" height="102" fill="#2a2529" stroke="#66565e"/><text x="382" y="32" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">REDUCED MOTION</text><text x="382" y="64" fill="#e7dfd6" font-family="Arial" font-size="16">The scene softens</text>
    <rect x="720" width="348" height="102" fill="#253531" stroke="#66565e"/><text x="742" y="32" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">KEYBOARD</text><text x="742" y="64" fill="#e7dfd6" font-family="Arial" font-size="16">The chapter stays navigable</text>
    <rect x="1080" width="350" height="102" fill="#2b3039" stroke="#66565e"/><text x="1102" y="32" fill="#efbf78" font-family="Arial" font-size="11" font-weight="700">FONT SCALE</text><text x="1102" y="64" fill="#e7dfd6" font-family="Arial" font-size="16">Reading stays yours</text>
  </g>
  <g transform="translate(72 735)"><rect width="710" height="76" fill="#3a272b" stroke="#66565e"/><text x="22" y="29" fill="#df8e83" font-family="Arial" font-size="11" font-weight="700">BK-1 · RIGHTS / AUTHORSHIP</text><text x="22" y="56" fill="#eadfdf" font-family="Arial" font-size="15">Real chapter, soundtrack, font, and AI/human records remain open.</text><rect x="722" width="708" height="76" fill="#312b36" stroke="#66565e"/><text x="744" y="29" fill="#df8e83" font-family="Arial" font-size="11" font-weight="700">CLAIM BOUNDARY</text><text x="744" y="56" fill="#eadfdf" font-family="Arial" font-size="15">Synthetic appendix only · no live synchronization or hosted claim.</text></g>
  <line x1="72" y1="849" x2="1528" y2="849" stroke="#efbf78" stroke-width="2"/><text x="72" y="879" fill="#b9b1a6" font-family="Arial" font-size="14">Synthetic showcase fixture · not product authorship</text><text x="1368" y="879" fill="#df8e83" font-family="Arial" font-size="14" font-weight="700">CANDIDATE LOCAL</text>
</svg>
