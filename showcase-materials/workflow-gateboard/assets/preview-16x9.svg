<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Workflow Gateboard — a blocked gate tells the truth</title>
  <desc id="desc">A current development checkpoint shows a declared gate manifest, a passed syntax receipt, and dependent gates that remain blocked until state persists.</desc>
  <defs>
    <radialGradient id="glow" cx="84%" cy="10%" r="54%"><stop offset="0" stop-color="#ffd166" stop-opacity=".18"/><stop offset="1" stop-color="#15130f" stop-opacity="0"/></radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#45361c"/><stop offset="1" stop-color="#2a2418"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="#15130f"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g font-family="Inter,Arial,sans-serif" fill="#fff8e7">
    <text x="112" y="148" font-size="22" font-weight="800" letter-spacing="3" fill="#ffd166">WORKFLOW GATEBOARD · DEV</text>
    <text x="112" y="290" font-size="78" font-weight="700">A blocked gate</text>
    <text x="112" y="382" font-size="78" font-weight="700">tells the truth.</text>
    <text x="112" y="458" font-size="26" fill="#c9bea8">Declare the command, see the dependency, and run only</text>
    <text x="112" y="498" font-size="26" fill="#c9bea8">what is ready to leave a bounded receipt.</text>
  </g>
  <g transform="translate(842 142)">
    <rect width="644" height="616" rx="24" fill="url(#card)" stroke="#ffefc1" stroke-opacity=".25"/>
    <g font-family="Inter,Arial,sans-serif">
      <text x="42" y="58" font-size="16" fill="#c9bea8" letter-spacing="2">MANIFEST · V1</text>
      <text x="602" y="58" text-anchor="end" font-size="16" fill="#9fe6bd" font-weight="700">TARGET-BOUND</text>
      <rect x="42" y="96" width="560" height="296" fill="#15130f" fill-opacity=".68" stroke="#ffefc1" stroke-opacity=".25"/>
      <g font-size="17">
        <text x="70" y="138" fill="#ffd166" font-weight="700">DECLARED GATES</text>
        <text x="70" y="194" fill="#fff8e7" font-weight="700">SYNTAX</text><text x="250" y="194" fill="#c9bea8">read · prerequisite</text><text x="532" y="194" text-anchor="end" fill="#9fe6bd" font-weight="700">PASSED</text>
        <text x="70" y="254" fill="#fff8e7" font-weight="700">TESTS</text><text x="250" y="254" fill="#c9bea8">depends on syntax</text><text x="532" y="254" text-anchor="end" fill="#ffd166" font-weight="700">BLOCKED</text>
        <text x="70" y="314" fill="#fff8e7" font-weight="700">PACKAGE</text><text x="250" y="314" fill="#c9bea8">depends on tests</text><text x="532" y="314" text-anchor="end" fill="#ffd166" font-weight="700">BLOCKED</text>
        <text x="70" y="364" fill="#958b77">separate CLI invocations need state handoff</text>
      </g>
      <rect x="42" y="430" width="560" height="92" fill="#15130f" fill-opacity=".68" stroke="#ffefc1" stroke-opacity=".25"/>
      <text x="70" y="468" font-size="16" fill="#ffd166" font-weight="700">RECEIPT</text>
      <text x="70" y="500" font-size="17" fill="#c9bea8">syntax.json · read-only · tracked ref unchanged</text>
      <text x="42" y="564" font-size="17" fill="#c9bea8">Current local proof · persistence and trace handoff remain open</text>
    </g>
  </g>
  <text x="112" y="790" font-family="Inter,Arial,sans-serif" font-size="18" fill="#958b77" letter-spacing="1">WORKFLOW GATEBOARD / CANDIDATE LOCAL MATERIAL</text>
</svg>
