<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Review Attention Map current local evidence</title>
  <desc id="desc">Two explicit review signals share one changed region while an unmatched signal and human disposition remain visible.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#11181e"/><stop offset="1" stop-color="#1d2a31"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#254344"/><stop offset="1" stop-color="#1d2a31"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity=".32"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#11181e"/>
  <circle cx="100" cy="80" r="360" fill="#9be9c1" opacity=".08"/>
  <g font-family="Arial, sans-serif" fill="#f4f6f1">
    <text x="112" y="126" fill="#9be9c1" font-size="19" font-weight="700" letter-spacing="3">REVIEW ATTENTION MAP · LOCAL</text>
    <text x="112" y="240" font-size="68" font-weight="700">Follow the</text>
    <text x="112" y="322" font-size="68" font-weight="700">reason.</text>
    <text x="112" y="405" fill="#a9bab6" font-size="27">Put explicit contract and behavior signals on a changed line.</text>
    <text x="112" y="444" fill="#a9bab6" font-size="27">Keep sources, uncertainty, and human review visible.</text>
    <g filter="url(#shadow)">
      <rect x="855" y="118" width="610" height="630" rx="18" fill="#1d2a31" stroke="#9be9c1" stroke-opacity=".24"/>
    </g>
    <text x="900" y="175" fill="#a9bab6" font-size="18" letter-spacing="3">CHANGED REGION</text>
    <text x="900" y="216" font-size="34" font-weight="700">src/api.ts:1</text>
    <text x="1320" y="216" fill="#9be9c1" font-size="18" text-anchor="end" letter-spacing="2">2 SOURCES</text>
    <rect x="900" y="254" width="520" height="108" rx="8" fill="#11181e" stroke="#9be9c1" stroke-opacity=".25"/>
    <circle cx="936" cy="290" r="10" fill="#9be9c1"/>
    <text x="964" y="298" fill="#9be9c1" font-size="20" font-weight="700" letter-spacing="2">CONTRACT WATCH</text>
    <text x="936" y="336" fill="#a9bab6" font-size="20">Response changed · source receipt available</text>
    <rect x="900" y="382" width="520" height="108" rx="8" fill="#11181e" stroke="#9be9c1" stroke-opacity=".25"/>
    <circle cx="936" cy="418" r="10" fill="#9be9c1"/>
    <text x="964" y="426" fill="#9be9c1" font-size="20" font-weight="700" letter-spacing="2">BEHAVIOR ATLAS</text>
    <text x="936" y="464" fill="#a9bab6" font-size="20">No assertion · source receipt available</text>
    <rect x="900" y="510" width="520" height="108" rx="8" fill="#11181e" stroke="#ffc878" stroke-opacity=".45"/>
    <circle cx="936" cy="546" r="10" fill="#ffc878"/>
    <text x="964" y="554" fill="#ffc878" font-size="20" font-weight="700" letter-spacing="2">UNMATCHED</text>
    <text x="936" y="592" fill="#a9bab6" font-size="20">Outside selected diff · remains visible</text>
    <text x="900" y="686" fill="#9be9c1" font-size="20" font-weight="700">REVIEWED · HUMAN DISPOSITION RECORDED</text>
    <text x="112" y="780" fill="#a9bab6" font-size="19">Local evidence only · direct producer handoff, hosting, and publication remain gated.</text>
  </g>
</svg>
