[quality_runner]
default_profile = "pronto"
allowed_package_managers = ["pnpm"]

[quality_runner.web_readiness]
applicability = "not_applicable"
reason = "Pronto ships as a native Tauri application, not a deployed web surface"

[quality_runner.profiles.pronto]
extends = "default"
required_capabilities = [
  "build",
  "tests",
  "runtime_smoke",
  "lint",
  "formatter",
  "typecheck",
  "dead_code",
  "failure_visibility",
  "security_secrets_scan",
  "security_dependency_audit",
]
allowed_package_managers = ["pnpm"]

[[quality_runner.gates]]
id = "build"
command = "pnpm build:bundle"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "tests"
command = "pnpm test"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "runtime_smoke"
command = "pnpm smoke"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "lint"
command = "pnpm lint"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "formatter"
command = "pnpm format:check"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "typecheck"
command = "pnpm typecheck"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "failure_visibility"
command = "pnpm failure-visibility"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "dead_code"
command = "pnpm audit:dead-code"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "security_secrets_scan"
command = "pnpm audit:secrets"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[[quality_runner.gates]]
id = "security_dependency_audit"
command = "pnpm audit:dependencies"
ecosystem = "pnpm"
source = "repository policy"
owner = "Pronto repository maintainers"
required = true
severity = "blocker"

[quality_runner.structural_scan]
similarity_enabled = false

[quality_runner.prevention]
required_modules = ["code_quality", "security"]
environment_paths = ["node_modules/.bin"]

[[quality_runner.prevention.rules]]
detector = "code_quality"
rule_id = "nested-ternary"
state = "behavior-verified"
owner = "pronto-maintainers"
rationale = "Nested conditional expressions obscure the branch behavior in Pronto's TypeScript UI."
paths = ["src/**/*.ts", "src/**/*.tsx"]
confidence_threshold = 1.0
evidence_refs = [
  "positive:quality-runner/tests/test_prevention_policy.py::test_nested_ternary_positive_promotion_fixture",
  "negative:quality-runner/tests/test_prevention_policy.py::test_nested_ternary_negative_promotion_fixture",
  "ambiguous:quality-runner/tests/test_prevention_policy.py::test_nested_ternary_ambiguous_syntax_fixture_is_not_enforced",
]

[[quality_runner.prevention.gates]]
id = "lint"
command = "pnpm lint"
state = "candidate"
required = false
owner = "pronto-maintainers"
rationale = "The locked ESLint command passed twice locally, but lacks CI and intentional-failure evidence."
bootstrap = "pnpm install --frozen-lockfile"
mutation_risk = "isolated-only"
scope = "JavaScript and TypeScript source"
timeout_seconds = 300
evidence_refs = [
  "repeat-pass:docs/quality-prevention.md",
  "local:docs/quality-prevention.md",
]

[[quality_runner.prevention.gates]]
id = "format-check"
command = "pnpm format:check"
state = "candidate"
required = false
owner = "pronto-maintainers"
rationale = "The locked Prettier check passed twice locally, but lacks CI and intentional-failure evidence."
bootstrap = "pnpm install --frozen-lockfile"
mutation_risk = "isolated-only"
scope = "Repository files selected by Prettier"
timeout_seconds = 300
evidence_refs = [
  "repeat-pass:docs/quality-prevention.md",
  "local:docs/quality-prevention.md",
]

[[quality_runner.prevention.gates]]
id = "typecheck"
command = "pnpm typecheck"
state = "candidate"
required = false
owner = "pronto-maintainers"
rationale = "The locked TypeScript check passed twice locally, but lacks CI and intentional-failure evidence."
bootstrap = "pnpm install --frozen-lockfile"
mutation_risk = "isolated-only"
scope = "TypeScript project"
timeout_seconds = 300
evidence_refs = [
  "repeat-pass:docs/quality-prevention.md",
  "local:docs/quality-prevention.md",
]

[[quality_runner.prevention.gates]]
id = "test"
command = "pnpm test"
state = "candidate"
required = false
owner = "pronto-maintainers"
rationale = "The Rust and Vitest suite passed twice locally, but lacks CI and intentional-failure evidence."
bootstrap = "pnpm install --frozen-lockfile; cargo fetch --locked"
mutation_risk = "isolated-only"
scope = "Rust and renderer test suites"
timeout_seconds = 900
evidence_refs = [
  "repeat-pass:docs/quality-prevention.md",
  "local:docs/quality-prevention.md",
]

[[quality_runner.prevention.gates]]
id = "smoke"
command = "pnpm smoke"
state = "candidate"
required = false
owner = "pronto-maintainers"
rationale = "The current smoke script passed locally, but lacks CI and intentional-failure evidence."
bootstrap = "pnpm install --frozen-lockfile"
mutation_risk = "isolated-only"
scope = "Read-only Pronto CLI startup"
timeout_seconds = 120
evidence_refs = [
  "repeat-pass:docs/quality-prevention.md",
  "local:docs/quality-prevention.md",
]
