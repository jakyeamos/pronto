[package]
name = "pronto"
version = "0.1.0"
default-run = "pronto"
description = "A local-first portfolio command center for Git repositories"
authors = ["Pronto"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.88.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "pronto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
dirs = "6"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
log = "0.4"
sha2 = "0.10.9"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-dialog = "2.4.2"
tauri-plugin-log = "2"
tiny_http = "0.12"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSAccessibility", "NSAccessibilityConstants", "NSAccessibilityProtocols", "NSButton", "NSControl", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSGeometry", "NSObject", "NSString"] }
objc2-web-kit = { version = "0.3.2", features = ["block2", "WKWebView"] }
