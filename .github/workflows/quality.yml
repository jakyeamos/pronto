name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install declared Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Check locked dependency graph at MSRV
        run: cargo +1.88.0 check --manifest-path src-tauri/Cargo.toml --locked

  quality:
    name: ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: pnpm build:bundle
            prerequisite: none
          - name: Tests
            command: pnpm test
            prerequisite: none
          - name: Runtime smoke
            command: pnpm smoke
            prerequisite: none
          - name: Lint
            command: pnpm lint
            prerequisite: none
          - name: Formatter
            command: pnpm format:check
            prerequisite: none
          - name: Typecheck
            command: pnpm typecheck
            prerequisite: none
          - name: Dead-code
            command: pnpm audit:dead-code
            prerequisite: none
          - name: Secrets scan
            command: pnpm audit:secrets
            prerequisite: gitleaks
          - name: Dependency audit
            command: pnpm audit:dependencies
            prerequisite: cargo-audit

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install gitleaks
        if: matrix.prerequisite == 'gitleaks'
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          case "$(uname -m)" in
            arm64)
              gitleaks_arch="arm64"
              gitleaks_sha256="b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5"
              ;;
            x86_64)
              gitleaks_arch="x64"
              gitleaks_sha256="dfe101a4db2255fc85120ac7f3d25e4342c3c20cf749f2c20a18081af1952709"
              ;;
            *)
              echo "Unsupported gitleaks architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          gitleaks_archive="$RUNNER_TEMP/gitleaks.tar.gz"
          gitleaks_bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --location --silent --show-error \
            --output "$gitleaks_archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_darwin_${gitleaks_arch}.tar.gz"
          printf '%s  %s\n' "$gitleaks_sha256" "$gitleaks_archive" | shasum -a 256 --check
          mkdir -p "$gitleaks_bin_dir"
          tar -xzf "$gitleaks_archive" -C "$gitleaks_bin_dir" gitleaks
          echo "$gitleaks_bin_dir" >> "$GITHUB_PATH"
          "$gitleaks_bin_dir/gitleaks" version

      - name: Install cargo-audit
        if: matrix.prerequisite == 'cargo-audit'
        run: cargo install cargo-audit --locked

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
